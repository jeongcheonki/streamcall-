<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>화상통화 — 어르신용</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0f4ff;--bg2:#ffffff;--bg3:#e8eeff;
  --border:#c5d0f0;--text:#1a1f3a;--text2:#4a5280;--text3:#8890b8;
  --accent:#2563eb;--accent2:#1d4ed8;
  --danger:#dc2626;--green:#16a34a;--radius:16px;
  --shadow:0 4px 20px rgba(37,99,235,.12);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',-apple-system,'맑은 고딕',sans-serif;
  font-size:18px;line-height:1.6;}
svg.ic{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* ── LOBBY ── */
#lobby{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.lobby-wrap{width:100%;max-width:500px;display:flex;flex-direction:column;gap:1.6rem;}
.logo{display:flex;align-items:center;gap:14px;justify-content:center;}
.logo-icon{width:56px;height:56px;border-radius:16px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 4px 16px rgba(37,99,235,.3);}
.logo-text{font-size:28px;font-weight:800;color:var(--accent);}
.card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius);
  padding:1.8rem;display:flex;flex-direction:column;gap:1.2rem;box-shadow:var(--shadow);}
label{font-size:17px;color:var(--text2);display:block;margin-bottom:8px;font-weight:600;}
input[type=text]{width:100%;background:var(--bg3);border:2px solid var(--border);
  border-radius:10px;color:var(--text);font-size:20px;padding:14px 18px;
  outline:none;transition:border-color .2s;}
input[type=text]:focus{border-color:var(--accent);background:#fff;}
.preview-box{width:100%;aspect-ratio:16/9;background:#1a1a2e;border-radius:12px;
  overflow:hidden;position:relative;border:2px solid var(--border);}
.preview-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.preview-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.4);font-size:16px;}
.preview-placeholder svg{width:48px;opacity:.4;}
.btn-row{display:flex;gap:12px;}
.btn-toggle{flex:1;padding:16px 12px;border-radius:12px;border:2.5px solid var(--border);
  background:var(--bg3);color:var(--text2);font-size:17px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
.btn-toggle:hover{border-color:var(--accent);color:var(--accent);}
.btn-toggle.on{border-color:var(--accent);color:var(--accent);background:#dbeafe;font-weight:700;}
.btn-primary{width:100%;padding:18px;border-radius:14px;border:none;
  background:var(--accent);color:#fff;font-size:20px;font-weight:700;
  cursor:pointer;transition:.2s;box-shadow:0 4px 14px rgba(37,99,235,.35);}
.btn-primary:hover{background:var(--accent2);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:15px;font-weight:600;}
.divider::before,.divider::after{content:'';flex:1;height:1.5px;background:var(--border);}
.id-box{background:var(--bg3);border:2px solid var(--border);border-radius:12px;
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
.id-label{font-size:15px;color:var(--text2);margin-bottom:4px;font-weight:600;}
.id-value{font-size:30px;font-weight:800;font-family:monospace;letter-spacing:4px;color:var(--accent);}
.copy-btn{background:var(--accent);border:none;border-radius:10px;color:#fff;
  padding:10px 20px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;}
.copy-btn:hover{background:var(--accent2);}
.status-msg{font-size:17px;color:var(--text2);text-align:center;min-height:22px;font-weight:500;}
.status-msg.error{color:var(--danger);font-weight:700;}
.status-msg.ok{color:var(--green);font-weight:700;}

/* ── CALL SCREEN ── */
#call-screen{display:none;height:100vh;overflow:hidden;background:#000;}
.call-layout{display:flex;height:100%;position:relative;}
.video-stage{flex:1;position:relative;background:#000;overflow:hidden;}
.video-grid{display:flex;width:100%;height:100%;}
.video-cell{flex:1;position:relative;background:#1a1a2e;overflow:hidden;}
.video-cell+.video-cell{border-left:3px solid #000;}
.video-cell video{width:100%;height:100%;object-fit:cover;display:block;}
#local-vid{transform:scaleX(-1);}
.vid-label{position:absolute;bottom:128px;left:14px;background:rgba(0,0,0,.75);
  border-radius:20px;padding:6px 16px;font-size:16px;color:#fff;font-weight:700;
  z-index:5;pointer-events:none;}
.remote-placeholder-call{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;color:rgba(255,255,255,.35);}
.remote-avatar{width:110px;height:110px;border-radius:50%;background:rgba(37,99,235,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:700;color:rgba(255,255,255,.6);
  border:3px solid rgba(37,99,235,.3);}
.remote-placeholder-call p{font-size:18px;}
.pip-cam-off{position:absolute;inset:0;background:#1a1a2e;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  gap:8px;color:rgba(255,255,255,.35);font-size:15px;}
.pip-cam-off svg{width:32px;opacity:.4;}

/* HUD */
.hud-top{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:10px;z-index:10;}
.badge{background:rgba(0,0,0,.7);border-radius:20px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;color:#fff;font-size:16px;font-weight:600;}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Controls */
.controls{position:absolute;bottom:0;left:0;right:0;
  background:rgba(15,15,30,.96);backdrop-filter:blur(12px);
  border-top:2px solid rgba(255,255,255,.1);
  padding:8px 10px 10px;display:flex;flex-direction:column;
  align-items:center;gap:6px;z-index:30;}
.ctrl-row1{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.ctrl-row2{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;flex-wrap:wrap;}
.ctrl-btn{width:56px;height:56px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);
  color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:.15s;flex-shrink:0;}
.ctrl-btn:hover{background:rgba(255,255,255,.25);}
.ctrl-btn:active{transform:scale(.92);}
.ctrl-btn .btn-lbl{font-size:9px;color:rgba(255,255,255,.75);font-weight:700;white-space:nowrap;}
.ctrl-btn.off{background:rgba(220,50,50,.3);border-color:rgba(220,50,50,.6);color:#fca5a5;}
.ctrl-btn.off .btn-lbl{color:#fca5a5;}
.ctrl-btn.active{background:rgba(37,99,235,.35);border-color:rgba(99,151,255,.6);color:#93c5fd;}
.end-btn{width:68px;height:68px;background:#dc2626;border-color:transparent;
  box-shadow:0 4px 18px rgba(220,38,38,.5);}
.end-btn:hover{background:#b91c1c;}
.end-btn .btn-lbl{color:#fff;font-size:10px;}
.side-btn{padding:8px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;}
.side-btn:hover{background:rgba(255,255,255,.18);}
.side-btn.active{border-color:#60a5fa;color:#93c5fd;background:rgba(37,99,235,.25);}
.quiz-start-btn{border-color:rgba(251,191,36,.5);color:#fbbf24;background:rgba(251,191,36,.1);}
.quiz-start-btn:hover{background:rgba(251,191,36,.2);}
.quiz-start-btn.active{background:rgba(251,191,36,.25);border-color:#fbbf24;}

/* Side panel */
.side-panel{width:0;background:#fff;border-left:2px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .25s;flex-shrink:0;}
.side-panel.open{width:340px;}
.panel-tabs{display:flex;border-bottom:2px solid var(--border);flex-shrink:0;background:var(--bg3);}
.tab-btn{flex:1;padding:16px 8px;background:none;border:none;
  color:var(--text2);font-size:16px;font-weight:600;cursor:pointer;
  border-bottom:3px solid transparent;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff;}
.panel-close{padding:12px 16px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;}
.panel-close:hover{color:var(--danger);}
.chat-pane,.wb-pane{display:none;flex:1;flex-direction:column;overflow:hidden;}
.chat-pane.active,.wb-pane.active{display:flex;}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f8faff;}
.chat-messages::-webkit-scrollbar{width:5px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.msg-row{display:flex;flex-direction:column;gap:3px;}
.msg-row.me{align-items:flex-end;}
.msg-row.them{align-items:flex-start;}
.msg-name{font-size:13px;color:var(--text3);padding:0 6px;font-weight:600;}
.msg-bubble{max-width:85%;padding:12px 16px;border-radius:14px;
  font-size:18px;line-height:1.6;word-break:break-word;}
.msg-row.me .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg-row.them .msg-bubble{background:#fff;color:var(--text);
  border:1.5px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:12px;color:var(--text3);padding:0 6px;}
.msg-system{text-align:center;font-size:14px;color:var(--text3);padding:6px 0;font-weight:500;}
.chat-input-area{padding:12px;border-top:2px solid var(--border);
  display:flex;gap:10px;align-items:flex-end;background:#fff;}
.chat-input-area textarea{flex:1;background:var(--bg3);border:2px solid var(--border);
  border-radius:12px;color:var(--text);font-size:18px;
  padding:12px 14px;resize:none;outline:none;max-height:120px;
  font-family:inherit;line-height:1.5;}
.chat-input-area textarea:focus{border-color:var(--accent);background:#fff;}
.send-btn{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 3px 10px rgba(37,99,235,.3);}
.send-btn:hover{background:var(--accent2);}
.unread-badge{background:var(--danger);color:#fff;border-radius:12px;
  font-size:12px;padding:2px 7px;margin-left:4px;font-weight:700;}
.wb-pane{position:relative;}
.wb-toolbar{padding:10px 12px;border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;background:var(--bg3);}
.wb-tool-btn{padding:8px 12px;border-radius:8px;border:2px solid var(--border);
  background:#fff;color:var(--text2);font-size:14px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s;}
.wb-tool-btn:hover{border-color:var(--accent);color:var(--accent);}
.wb-tool-btn.active{border-color:var(--accent);color:var(--accent);background:#dbeafe;}
.wb-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;transition:.1s;flex-shrink:0;}
.wb-color-swatch.selected{border-color:var(--accent);}
.wb-size-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);font-weight:600;}
#wb-canvas{flex:1;background:#1a1a2e;cursor:crosshair;display:block;width:100%;}
.wb-canvas-wrap{flex:1;overflow:hidden;position:relative;}

/* ── 퀴즈 오버레이 ── */
#quiz-overlay{display:none;position:absolute;bottom:128px;left:50%;
  transform:translateX(-50%);z-index:50;width:min(400px,52vw);user-select:none;}
#quiz-overlay.show{display:block;}
#quiz-overlay.dragging{cursor:grabbing;}
.quiz-card{background:rgba(10,10,20,.93);backdrop-filter:blur(18px);
  border:2px solid rgba(251,191,36,.5);border-radius:22px;
  padding:1.6rem;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:0 8px 40px rgba(0,0,0,.7);}
.quiz-header{display:flex;align-items:center;justify-content:space-between;
  width:100%;gap:8px;cursor:grab;}
.quiz-header:active{cursor:grabbing;}
.quiz-title{font-size:14px;color:rgba(251,191,36,.85);font-weight:800;letter-spacing:.5px;}
.quiz-score-badge{font-size:14px;color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;}
.quiz-word{font-size:clamp(28px,5vw,42px);font-weight:800;color:#fff;
  text-align:center;text-shadow:0 2px 14px rgba(251,191,36,.35);}
.quiz-hint{font-size:14px;color:rgba(255,255,255,.4);text-align:center;}

/* 퀴즈 그림 */
.quiz-img-wrap{width:100%;height:140px;border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.quiz-img-wrap svg{width:100%;height:100%;}
.quiz-img-loading{display:flex;flex-direction:column;align-items:center;
  gap:8px;color:rgba(255,255,255,.3);font-size:13px;}
.quiz-img-spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.1);
  border-top-color:#fbbf24;border-radius:50%;animation:qspin .75s linear infinite;}
@keyframes qspin{to{transform:rotate(360deg);}}

.quiz-timer-wrap{position:relative;width:70px;height:70px;flex-shrink:0;}
.quiz-timer-svg{transform:rotate(-90deg);}
.quiz-timer-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5;}
.quiz-timer-ring{fill:none;stroke:#fbbf24;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:163;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .5s;}
.quiz-timer-ring.urgent{stroke:#ef4444;}
.quiz-timer-num{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:800;color:#fff;
  font-variant-numeric:tabular-nums;}
.quiz-actions{display:flex;gap:10px;width:100%;}
.quiz-btn{flex:1;padding:13px 8px;border-radius:12px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
.quiz-btn.correct{background:rgba(22,163,74,.25);color:#4ade80;border:2px solid rgba(22,163,74,.4);}
.quiz-btn.correct:hover{background:rgba(22,163,74,.4);}
.quiz-btn.skip{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);
  border:2px solid rgba(255,255,255,.15);}
.quiz-btn.skip:hover{background:rgba(255,255,255,.2);}
.quiz-btn.stop{background:rgba(220,38,38,.2);color:#f87171;border:2px solid rgba(220,38,38,.35);}
.quiz-btn.stop:hover{background:rgba(220,38,38,.35);}
.quiz-result-flash{position:absolute;inset:0;border-radius:22px;display:flex;
  align-items:center;justify-content:center;font-size:56px;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.quiz-result-flash.show{opacity:1;}

.quiz-notify{display:none;position:absolute;bottom:128px;left:50%;
  transform:translateX(-50%);z-index:50;width:min(260px,34vw);user-select:none;}
.quiz-notify.show{display:block;}
.quiz-notify.dragging{cursor:grabbing;}
.quiz-notify-card{background:rgba(10,10,20,.9);backdrop-filter:blur(12px);
  border:2px solid rgba(251,191,36,.35);border-radius:16px;
  padding:16px 20px;text-align:center;cursor:grab;}
.quiz-notify-card:active{cursor:grabbing;}
.quiz-notify-card p{font-size:16px;color:rgba(255,255,255,.65);margin-bottom:8px;}
.quiz-notify-card strong{font-size:18px;color:#fbbf24;}
.quiz-notify-timer{font-size:38px;font-weight:800;color:#fff;margin-top:8px;
  font-variant-numeric:tabular-nums;}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#1e293b;border-radius:12px;padding:14px 24px;
  color:#fff;font-size:18px;font-weight:600;
  pointer-events:none;opacity:0;transition:opacity .3s;
  white-space:nowrap;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.show{opacity:1;}

/* Incoming */
#incoming-overlay{display:none;position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;}
.incoming-card{background:#fff;border-radius:24px;padding:3rem 2.5rem;
  display:flex;flex-direction:column;align-items:center;gap:1.4rem;
  min-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.ring-avatar{width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#6366f1);
  display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:800;color:#fff;
  animation:ring 1.4s ease-in-out infinite;}
@keyframes ring{
  0%,100%{box-shadow:0 0 0 10px rgba(37,99,235,.15),0 0 0 20px rgba(37,99,235,.07);}
  50%{box-shadow:0 0 0 14px rgba(37,99,235,.2),0 0 0 28px rgba(37,99,235,.1);}
}
.incoming-name{font-size:26px;font-weight:800;color:var(--text);}
.incoming-sub{font-size:18px;color:var(--text2);}
.incoming-btns{display:flex;gap:24px;margin-top:.5rem;}
.incoming-accept{width:80px;height:80px;border-radius:50%;border:none;
  background:var(--green);color:#fff;font-size:32px;cursor:pointer;
  box-shadow:0 4px 16px rgba(22,163,74,.4);}
.incoming-accept:hover{background:#15803d;}
.incoming-reject{width:80px;height:80px;border-radius:50%;border:none;
  background:var(--danger);color:#fff;font-size:32px;cursor:pointer;
  box-shadow:0 4px 16px rgba(220,38,38,.4);}
.incoming-reject:hover{background:#b91c1c;}
.incoming-hint{font-size:16px;color:var(--text2);}

@media(max-width:600px){
  .side-panel.open{width:100%;position:absolute;inset:0;z-index:50;}
  .ctrl-btn{width:46px;height:46px;}
  .ctrl-btn svg{width:18px;height:18px;}
  .ctrl-btn .btn-lbl{font-size:8px;}
  .end-btn{width:56px;height:56px;}
  .ctrl-row1{gap:5px;}
  .ctrl-row2{gap:4px;}
  .side-btn{padding:7px 9px;font-size:12px;}
  .vid-label{bottom:138px;}
  .side-btn{padding:8px 10px;font-size:13px;}
}
</style>
</head>
<body>

<!-- ── LOBBY ── -->
<div id="lobby">
  <div class="lobby-wrap">
    <div class="logo">
      <div class="logo-icon">
        <svg class="ic" width="26" height="26" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <span class="logo-text">화상통화</span>
    </div>

    <div class="card">
      <div>
        <label>📛 내 이름</label>
        <input type="text" id="my-name" placeholder="이름을 입력하세요" autocomplete="off"/>
      </div>
      <div>
        <label>📷 카메라 미리보기</label>
        <div class="preview-box">
          <video id="preview-vid" autoplay muted playsinline></video>
          <div class="preview-placeholder" id="preview-ph">
            <svg class="ic" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span>아래 버튼을 눌러 카메라를 켜세요</span>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-toggle" id="cam-toggle" onclick="togglePreCam()">
          <svg class="ic" width="20" height="20" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          카메라 켜기
        </button>
        <button class="btn-toggle" id="mic-toggle" onclick="togglePreMic()">

<script>
// ── State ──
let peer=null,localStream=null,currentCall=null,pendingCall=null,dataConn=null;
let remotePeerId='',micEnabled=true,camEnabled=true,sharing=false,screenStream=null;
let timerInterval=null,elapsed=0,facingMode='user';
let preCamOn=false,preMicOn=false,preStream=null;
let panelOpen=false,currentTab='chat',unreadCount=0;
let myName='이름없음';

// ── PeerJS ──
function initPeer(){
  const id=String(Math.floor(1000+Math.random()*9000));

  const iceServers=[
    // STUN 서버 (여러 개)
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun3.l.google.com:19302'},
    {urls:'stun:stun4.l.google.com:19302'},
    {urls:'stun:global.stun.twilio.com:3478'},
    // 무료 TURN 서버 (NAT/방화벽 우회 — 핵심!)
    {
      urls:'turn:openrelay.metered.ca:80',
      username:'openrelayproject',
      credential:'openrelayproject'
    },
    {
      urls:'turn:openrelay.metered.ca:443',
      username:'openrelayproject',
      credential:'openrelayproject'
    },
    {
      urls:'turn:openrelay.metered.ca:443?transport=tcp',
      username:'openrelayproject',
      credential:'openrelayproject'
    },
  ];

  peer=new Peer(id,{
    host:'0.peerjs.com',port:443,path:'/',secure:true,
    debug:1,
    config:{
      iceServers,
      iceTransportPolicy:'all',
      sdpSemantics:'unified-plan',
    }
  });

  peer.on('open',pid=>{
    document.getElementById('my-id-display').textContent=pid;
    setLobbyStatus('✅ 준비 완료 — 번호를 상대방에게 알려주세요','ok');
    document.getElementById('ready-btn').disabled=false;
    document.getElementById('call-btn').disabled=false;
  });
  peer.on('error',err=>{
    console.error('PeerJS 오류:', err);
    if(err.type==='peer-unavailable'){
      setLobbyStatus('상대방을 찾을 수 없습니다','error');
      showToast('❌ 상대방이 접속해 있지 않습니다');
    } else if(err.type==='network'||err.type==='server-error'||err.type==='socket-error'){
      setLobbyStatus('서버 연결 오류 — 잠시 후 재연결 중...','error');
      setTimeout(()=>{ try{ peer.reconnect(); }catch(e){ initPeer(); } }, 3000);
    } else {
      setLobbyStatus('오류: '+err.type,'error');
      showToast('⚠️ 오류: '+err.type);
    }
  });
  peer.on('call',incoming=>{
    pendingCall=incoming;
    const name=incoming.metadata?.name||incoming.peer;
    document.getElementById('incoming-name').textContent=name;
    document.getElementById('ring-avatar').textContent=name.charAt(0).toUpperCase();
    document.getElementById('incoming-overlay').style.display='flex';
  });
  peer.on('connection',conn=>setupDataConn(conn));
  peer.on('disconnected',()=>{
    console.log('PeerJS 연결 끊김, 재연결 시도...');
    setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} }, 1000);
  });
}

function setupDataConn(conn){
  dataConn=conn;
  conn.on('open',()=>showToast('💬 채팅 연결됨'));
  conn.on('data',data=>{
    if(data.type==='chat') receiveChatMsg(data);
    else if(data.type==='wb-draw') wbReceiveDraw(data);
    else if(data.type==='wb-clear') wbClearLocal();
    else if(data.type==='wb-undo') wbUndoLocal();
    else if(data.type.startsWith('quiz-')) handleQuizData(data);
  });
  conn.on('close',()=>{ dataConn=null; });
}
function sendData(obj){ if(dataConn&&dataConn.open) dataConn.send(obj); }

// ── Media ──
async function togglePreCam(){
  const btn=document.getElementById('cam-toggle');
  if(!preCamOn){
    try{
      preStream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:preMicOn});
      document.getElementById('preview-vid').srcObject=preStream;
      document.getElementById('preview-ph').style.display='none';
      preCamOn=true; btn.classList.add('on');
      btn.textContent='📷 카메라 켜짐';
    }catch(e){showToast('카메라 권한이 필요합니다 (localhost 또는 https)');}
  }else{
    if(preStream) preStream.getVideoTracks().forEach(t=>t.stop());
    document.getElementById('preview-vid').srcObject=null;
    document.getElementById('preview-ph').style.display='flex';
    preCamOn=false; btn.classList.remove('on');
    btn.innerHTML='<svg class="ic" width="20" height="20" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> 카메라 켜기';
  }
}
async function togglePreMic(){
  preMicOn=!preMicOn;
  const btn=document.getElementById('mic-toggle');
  btn.classList.toggle('on',preMicOn);
  btn.innerHTML=preMicOn
    ?'<svg class="ic" width="20" height="20" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 마이크 켜짐'
    :'<svg class="ic" width="20" height="20" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 마이크 켜기';
}
async function getLocalStream(){
  if(localStream) return localStream;
  try{ localStream=await navigator.mediaDevices.getUserMedia({video:preCamOn?{facingMode}:false,audio:true}); }
  catch(e){ try{ localStream=await navigator.mediaDevices.getUserMedia({video:false,audio:true}); }catch(e2){ localStream=new MediaStream(); } }
  return localStream;
}
function goReady(){
  myName=document.getElementById('my-name').value.trim()||'이름없음';
  document.getElementById('my-name').value=myName;
  showToast('✅ 준비 완료!');
}
async function callPeer(){
  const peerId=document.getElementById('peer-id-input').value.trim();
  if(!peerId){showToast('상대방 번호를 입력하세요');return;}
  if(peerId===peer.id){showToast('자기 자신에게는 전화할 수 없습니다');return;}
  setLobbyStatus('연결 중...','');
  const stream=await getLocalStream();
  myName=document.getElementById('my-name').value||'이름없음';

  // 데이터 채널 연결
  const conn=peer.connect(peerId,{metadata:{name:myName},reliable:true});
  setupDataConn(conn);

  // 영상통화 연결
  const call=peer.call(peerId,stream,{metadata:{name:myName}});
  if(!call){setLobbyStatus('연결 실패 — 상대방 번호를 확인하세요','error');return;}

  currentCall=call; remotePeerId=peerId;
  document.getElementById('peer-name-disp').textContent=peerId;
  document.getElementById('call-avatar').textContent=peerId.charAt(0);
  document.getElementById('peer-vid-label').textContent=peerId;
  document.getElementById('call-status-txt').textContent='연결 중...';

  // 이벤트 먼저 등록
  call.on('stream',rs=>{
    console.log('스트림 수신 (발신)');
    const rv=document.getElementById('remote-vid');
    rv.srcObject=rs;
    rv.play().catch(e=>console.warn('video play error:',e));
    document.getElementById('remote-ph-call').style.display='none';
    showToast('✅ 연결되었습니다!'); startTimer();

    showToast('연결 오류: '+e.message);
    endCallCleanup();
  });
  // ICE 연결 상태 모니터링

async function ctrlShare(){
  const btn=document.getElementById('ctrl-share');
  if(!sharing){
    try{
      screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});
      const track=screenStream.getVideoTracks()[0];
      const sender=currentCall?.peerConnection?.getSenders().find(s=>s.track?.kind==='video');
      if(sender) sender.replaceTrack(track);
      document.getElementById('local-vid').srcObject=screenStream;
      sharing=true; btn.classList.add('active');

      track.onended=()=>stopShare();

function stopShare(){
  if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}
  const sender=currentCall?.peerConnection?.getSenders().find(s=>s.track?.kind==='video');
  const camTrack=localStream?.getVideoTracks()[0];
  if(sender&&camTrack) sender.replaceTrack(camTrack);
  if(localStream) document.getElementById('local-vid').srcObject=localStream;
  sharing=false; document.getElementById('ctrl-share').classList.remove('active');
  showToast('화면 공유 종료');
}
async function flipCamera(){
  facingMode=facingMode==='user'?'environment':'user';
  try{
    const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:true});
    const nt=ns.getVideoTracks()[0];
    const sender=currentCall?.peerConnection?.getSenders().find(s=>s.track?.kind==='video');
    if(sender) sender.replaceTrack(nt);
    if(localStream){localStream.getVideoTracks().forEach(t=>{t.stop();localStream.removeTrack(t);});localStream.addTrack(nt);}
    document.getElementById('local-vid').srcObject=localStream;
    showToast(facingMode==='user'?'셀카 카메라':'후면 카메라');
  }catch(e){showToast('카메라 전환 실패');}
}

let wbCanvas,wbCtx,wbDrawing=false,wbTool='pen',wbColor='#1a1a2e',wbSize=3;
let wbStartX,wbStartY,wbSnap=null,wbHistory=[],MAX_HISTORY=30;
function initWhiteboard(){
  wbCanvas=document.getElementById('wb-canvas');
  wbCtx=wbCanvas.getContext('2d');
  resizeWbCanvas();
  wbCanvas.addEventListener('mousedown',wbStart);
  wbCanvas.addEventListener('mousemove',wbMove);
  wbCanvas.addEventListener('mouseup',wbEnd);
  wbCanvas.addEventListener('mouseleave',wbEnd);
  wbCanvas.addEventListener('touchstart',e=>{e.preventDefault();wbStart(e.touches[0]);},{passive:false});
  wbCanvas.addEventListener('touchmove',e=>{e.preventDefault();wbMove(e.touches[0]);},{passive:false});
  wbCanvas.addEventListener('touchend',e=>{e.preventDefault();wbEnd();},{passive:false});
}
function resizeWbCanvas(){
  if(!wbCanvas) return;
  const wrap=wbCanvas.parentElement;
  const img=wbCtx?wbCtx.getImageData(0,0,wbCanvas.width,wbCanvas.height):null;
  wbCanvas.width=wrap.clientWidth||300; wbCanvas.height=wrap.clientHeight||400;
  wbCtx.fillStyle='#fff'; wbCtx.fillRect(0,0,wbCanvas.width,wbCanvas.height);
  if(img) wbCtx.putImageData(img,0,0);
}
function getWbPos(e){const r=wbCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function wbSaveHistory(){if(wbHistory.length>=MAX_HISTORY)wbHistory.shift();wbHistory.push(wbCtx.getImageData(0,0,wbCanvas.width,wbCanvas.height));}
function wbStart(e){
  if(wbTool==='text'){
    const pos=getWbPos(e);const txt=prompt('텍스트 입력:');
    if(txt){wbSaveHistory();wbCtx.font=`${Math.max(16,wbSize*4)}px -apple-system,sans-serif`;wbCtx.fillStyle=wbColor;wbCtx.fillText(txt,pos.x,pos.y);wbSendDraw({tool:'text',x:pos.x,y:pos.y,text:txt,color:wbColor,size:wbSize});}
    return;
  }
  wbDrawing=true;const pos=getWbPos(e);wbStartX=pos.x;wbStartY=pos.y;wbSaveHistory();
  if(wbTool==='pen'||wbTool==='eraser'){wbCtx.beginPath();wbCtx.moveTo(pos.x,pos.y);}
  if(wbTool==='line'||wbTool==='rect'||wbTool==='circle'){wbSnap=wbCtx.getImageData(0,0,wbCanvas.width,wbCanvas.height);}
}
function wbMove(e){
  if(!wbDrawing) return;const pos=getWbPos(e);
  if(wbTool==='pen'){
    wbCtx.strokeStyle=wbColor;wbCtx.lineWidth=wbSize;wbCtx.lineCap='round';wbCtx.lineJoin='round';
    wbCtx.lineTo(pos.x,pos.y);wbCtx.stroke();
    wbSendDraw({tool:'pen-seg',x1:wbStartX,y1:wbStartY,x2:pos.x,y2:pos.y,color:wbColor,size:wbSize});
    wbCtx.beginPath();wbCtx.moveTo(pos.x,pos.y);wbStartX=pos.x;wbStartY=pos.y;
  }else if(wbTool==='eraser'){
    wbCtx.strokeStyle='#fff';wbCtx.lineWidth=wbSize*5;wbCtx.lineCap='round';wbCtx.lineJoin='round';
    wbCtx.lineTo(pos.x,pos.y);wbCtx.stroke();
    wbSendDraw({tool:'pen-seg',x1:wbStartX,y1:wbStartY,x2:pos.x,y2:pos.y,color:'#fff',size:wbSize*5});
    wbCtx.beginPath();wbCtx.moveTo(pos.x,pos.y);wbStartX=pos.x;wbStartY=pos.y;
  }else if(wbSnap){
    wbCtx.putImageData(wbSnap,0,0);wbCtx.strokeStyle=wbColor;wbCtx.lineWidth=wbSize;wbCtx.beginPath();
    if(wbTool==='line'){wbCtx.moveTo(wbStartX,wbStartY);wbCtx.lineTo(pos.x,pos.y);wbCtx.stroke();}
    else if(wbTool==='rect'){wbCtx.strokeRect(wbStartX,wbStartY,pos.x-wbStartX,pos.y-wbStartY);}
    else if(wbTool==='circle'){const rx=Math.abs(pos.x-wbStartX)/2,ry=Math.abs(pos.y-wbStartY)/2,cx=wbStartX+(pos.x-wbStartX)/2,cy=wbStartY+(pos.y-wbStartY)/2;wbCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);wbCtx.stroke();}
  }
}
function wbEnd(e){
  if(!wbDrawing) return;wbDrawing=false;
  if(wbTool==='line'||wbTool==='rect'||wbTool==='circle'){
    let ex,ey;if(e&&e.clientX!==undefined){const p=getWbPos(e);ex=p.x;ey=p.y;}else{ex=wbStartX;ey=wbStartY;}
    if(ex!==undefined)wbSendDraw({tool:wbTool,x1:wbStartX,y1:wbStartY,x2:ex,y2:ey,color:wbColor,size:wbSize});
    wbSnap=null;
  }
}
function wbSendDraw(data){sendData({type:'wb-draw',...data});}
function wbReceiveDraw(data){
  if(!wbCtx) return;
  wbCtx.strokeStyle=data.color;wbCtx.lineWidth=data.size;wbCtx.lineCap='round';wbCtx.lineJoin='round';wbCtx.beginPath();
  if(data.tool==='pen-seg'){wbCtx.moveTo(data.x1,data.y1);wbCtx.lineTo(data.x2,data.y2);wbCtx.stroke();}
  else if(data.tool==='line'){wbCtx.moveTo(data.x1,data.y1);wbCtx.lineTo(data.x2,data.y2);wbCtx.stroke();}
  else if(data.tool==='rect'){wbCtx.strokeRect(data.x1,data.y1,data.x2-data.x1,data.y2-data.y1);}
  else if(data.tool==='circle'){const rx=Math.abs(data.x2-data.x1)/2,ry=Math.abs(data.y2-data.y1)/2,cx=data.x1+(data.x2-data.x1)/2,cy=data.y1+(data.y2-data.y1)/2;wbCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);wbCtx.stroke();}
  else if(data.tool==='text'){wbCtx.font=`${Math.max(16,data.size*4)}px -apple-system,sans-serif`;wbCtx.fillStyle=data.color;wbCtx.fillText(data.text,data.x,data.y);}
}
function wbUndo(){if(wbHistory.length===0){showToast('더 이상 되돌릴 수 없습니다');return;}const snap=wbHistory.pop();wbCtx.putImageData(snap,0,0);sendData({type:'wb-undo'});}
function wbUndoLocal(){if(wbHistory.length===0)return;wbCtx.putImageData(wbHistory.pop(),0,0);}
function wbClear(){if(!confirm('화이트보드를 지울까요?'))return;wbSaveHistory();wbCtx.fillStyle='#fff';wbCtx.fillRect(0,0,wbCanvas.width,wbCanvas.height);sendData({type:'wb-clear'});}
function wbClearLocal(){if(!wbCtx)return;wbCtx.fillStyle='#fff';wbCtx.fillRect(0,0,wbCanvas.width,wbCanvas.height);}
function setWbTool(t){wbTool=t;document.querySelectorAll('.wb-tool-btn').forEach(b=>b.classList.remove('active'));const el=document.getElementById('wbt-'+t);if(el)el.classList.add('active');wbCanvas.style.cursor=t==='eraser'?'cell':t==='text'?'text':'crosshair';}
function setWbColor(c,el){wbColor=c;document.querySelectorAll('.wb-color-swatch').forEach(s=>s.classList.remove('selected'));el.classList.add('selected');}

    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:
          `단어 "${word}"를 나타내는 귀여운 SVG 일러스트를 그려줘.\n조건:\n- viewBox="0 0 200 130"\n- 배경 rect 없음 (투명)\n- 밝고 선명한 색상\n- <text><tspan> 금지\n- SVG 코드만 출력`
        }]
      })
    });
    const data=await res.json();
    const raw=(data.content?.[0]?.text)||'';
    const m=raw.match(/<svg[\s\S]*?<\/svg>/i);
    if(m){
      const safe=m[0].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+\s*=/gi,'data-x=').replace(/javascript:/gi,'').replace(/<text[\s\S]*?<\/text>/gi,'');
      quizImgCache[word]=safe;
      renderQuizSvg(safe);
    }else{renderEmoji(word);}
  }catch(e){renderEmoji(word);}
}
function renderQuizSvg(svg){
  const wrap=document.getElementById('quiz-img-wrap');
  if(!wrap) return;
  wrap.innerHTML=svg;
  const el=wrap.querySelector('svg');
  if(el){el.style.width='100%';el.style.height='100%';}
}
function renderEmoji(word){
  const wrap=document.getElementById('quiz-img-wrap');
  if(!wrap) return;
  const em=WORD_EMOJI[word]||'🎯';
  wrap.innerHTML=`<div style="font-size:80px;line-height:1">${em}</div>`;
}

// ── 퀴즈 로직 ──
const QUIZ_TIME=30;
let quizActive=false,quizIsExplainer=false,quizWord='',quizRound=0,quizScore=0;
let quizTimer=null,quizSecondsLeft=QUIZ_TIME,usedWords=[];

function startQuiz(){
  if(quizActive){quizStop();return;}
  quizActive=true;quizIsExplainer=true;quizScore=0;quizRound=0;usedWords=[];
  document.getElementById('quiz-score').textContent=0;
  document.getElementById('btn-quiz').classList.add('active');
  const qo=document.getElementById('quiz-overlay');
  qo.style.top='';qo.style.left='';qo.style.bottom='128px';qo.style.transform='translateX(-50%)';
  sendData({type:'quiz-start'});
  quizNextWord();
}
function quizNextWord(){
  let pool=QUIZ_WORDS.filter(w=>!usedWords.includes(w));
  if(pool.length===0){usedWords=[];pool=[...QUIZ_WORDS];}
  quizWord=pool[Math.floor(Math.random()*pool.length)];
  usedWords.push(quizWord);
  quizRound++;quizSecondsLeft=QUIZ_TIME;
  document.getElementById('quiz-word').textContent=quizWord;
  document.getElementById('quiz-hint').textContent=`${quizRound}번째 문제 · ${quizWord.length}글자`;
  document.getElementById('quiz-countdown').textContent=QUIZ_TIME;
  updateQuizRing(QUIZ_TIME);
  document.getElementById('quiz-ring').classList.remove('urgent');
  document.getElementById('quiz-overlay').classList.add('show');
  // AI 그림 생성
  generateQuizImage(quizWord);
  clearInterval(quizTimer);
  quizTimer=setInterval(()=>{
    quizSecondsLeft--;
    document.getElementById('quiz-countdown').textContent=quizSecondsLeft;
    updateQuizRing(quizSecondsLeft);
    if(quizSecondsLeft<=10) document.getElementById('quiz-ring').classList.add('urgent');
    sendData({type:'quiz-tick',round:quizRound,secondsLeft:quizSecondsLeft});
    if(quizSecondsLeft<=0){quizTimeUp();}
  },1000);
}
function updateQuizRing(s){
  const offset=163-(163*s/QUIZ_TIME);
  document.getElementById('quiz-ring').style.strokeDashoffset=offset;
}
function quizTimeUp(){clearInterval(quizTimer);quizFlash('⏰');sendData({type:'quiz-timeup',round:quizRound});setTimeout(()=>quizNextWord(),1500);}
function quizCorrect(){
  if(!quizActive||!quizIsExplainer) return;
  clearInterval(quizTimer);quizScore++;
  document.getElementById('quiz-score').textContent=quizScore;
  quizFlash('✅');
  sendData({type:'quiz-correct',round:quizRound,score:quizScore,word:quizWord});
  setTimeout(()=>quizNextWord(),1200);
}
function quizSkip(){
  if(!quizActive||!quizIsExplainer) return;
  clearInterval(quizTimer);quizFlash('⏭');
  sendData({type:'quiz-skip',round:quizRound,word:quizWord});
  setTimeout(()=>quizNextWord(),900);
}
function quizStop(){
  clearInterval(quizTimer);quizActive=false;
  document.getElementById('quiz-overlay').classList.remove('show');
  document.getElementById('quiz-notify').classList.remove('show');
  document.getElementById('btn-quiz').classList.remove('active');
  if(quizIsExplainer){
    sendData({type:'quiz-end',score:quizScore,rounds:quizRound});
    showToast(`퀴즈 종료 — ${quizRound}문제 중 ${quizScore}개 정답!`);
    appendChatMsg({type:'chat',name:'🎯 퀴즈',text:`퀴즈 종료! ${quizRound}문제 중 ${quizScore}개 정답`,time:Date.now()},true);
  }
  quizIsExplainer=false;
}
function quizFlash(emoji){
  const el=document.getElementById('quiz-flash');
  el.textContent=emoji;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),700);
}
function handleQuizData(data){
  if(data.type==='quiz-start'){
    quizActive=true;quizIsExplainer=false;quizRound=0;
    showToast('🎯 퀴즈 시작! 상대방의 설명을 듣고 맞춰보세요');
    appendChatMsg({type:'chat',name:'🎯 퀴즈',text:'퀴즈가 시작됩니다! 채팅으로 답을 입력하세요',time:Date.now()},false);
  }else if(data.type==='quiz-tick'){
    quizRound=data.round;
    document.getElementById('quiz-notify').classList.add('show');
    document.getElementById('quiz-notify-round').textContent=`${data.round}번째 문제`;
    document.getElementById('quiz-notify-timer').textContent=data.secondsLeft;
    document.getElementById('quiz-notify-timer').style.color=data.secondsLeft<=10?'#ef4444':'#fff';
  }else if(data.type==='quiz-correct'){
    showToast(`✅ 정답! "${data.word}" (${data.score}점)`);
    appendChatMsg({type:'chat',name:'🎯 퀴즈',text:`정답! 단어는 "${data.word}"이었습니다 🎉 (${data.score}점)`,time:Date.now()},false);
  }else if(data.type==='quiz-skip'){
    showToast(`⏭ 넘어감 — 단어: "${data.word}"`);
    appendChatMsg({type:'chat',name:'🎯 퀴즈',text:`패스! 단어는 "${data.word}"이었습니다`,time:Date.now()},false);
  }else if(data.type==='quiz-timeup'){
    showToast('⏰ 시간 초과!');
  }else if(data.type==='quiz-end'){
    quizActive=false;
    document.getElementById('quiz-notify').classList.remove('show');
    showToast(`퀴즈 종료 — ${data.rounds}문제 중 ${data.score}개 정답!`);
    appendChatMsg({type:'chat',name:'🎯 퀴즈',text:`퀴즈 종료! 총 ${data.rounds}문제 중 ${data.score}개 정답`,time:Date.now()},false);
  }
}

// 퀴즈 오버레이 드래그
(function(){
  const el=document.getElementById('quiz-overlay');
  const handle=el.querySelector('.quiz-header');
  let dragging=false,ox=0,oy=0;
  handle.addEventListener('mousedown',e=>{
    dragging=true;
    const r=el.getBoundingClientRect();
    el.style.bottom='auto';el.style.transform='none';
    el.style.left=r.left+'px';el.style.top=r.top+'px';
    ox=e.clientX-r.left;oy=e.clientY-r.top;
    el.classList.add('dragging');e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const pr=el.parentElement.getBoundingClientRect();
    let nx=e.clientX-pr.left-ox,ny=e.clientY-pr.top-oy;
    nx=Math.max(0,Math.min(nx,pr.width-el.offsetWidth));
    ny=Math.max(0,Math.min(ny,pr.height-el.offsetHeight));
    el.style.left=nx+'px';el.style.top=ny+'px';
  });
  document.addEventListener('mouseup',()=>{dragging=false;el.classList.remove('dragging');});
})();
